[project]
name = "yolpe"
version = "0.1.0"
description = "CCTV 원거리 사람 인식을 위한 YOLO26s 파인튜닝"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pyyaml>=6.0",
    "ultralytics>=8.4",   # YOLO26을 지원하는 버전 이상
    "torch>=2.4",
    "torchvision>=0.19",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false   # scripts/만 있는 저장소라 설치할 패키지가 없다

# PyPI의 Windows용 torch는 CPU 전용이라 NVIDIA GPU를 쓰려면 CUDA 빌드를 받는다.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
